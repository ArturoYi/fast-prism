[versions]
agp = "8.7.0"
kotlin = "2.2.21"
vanniktechMavenPublish = "0.28.0"
compileSdk = "34"
minSdk = "21"
targetSdk = "34"
androidxCore = "1.13.1"
androidxAppcompat = "1.7.0"
junit = "4.13.2"
junitJupiter = "5.11.4"
junitPlatform = "1.11.4"
okhttp = "5.3.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }

# convention 插件编译期使用。模块不要直接 apply 这些插件。
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
vanniktech-mavenPublish = { group = "com.vanniktech", name = "gradle-maven-publish-plugin", version.ref = "vanniktechMavenPublish" }

[plugins]
sdk-android-library = { id = "sdk.android.library" }
sdk-android-library-published = { id = "sdk.android.library.published" }
sdk-android-application = { id = "sdk.android.application" }
sdk-android-lint = { id = "sdk.android.lint" }
sdk-bom = { id = "sdk.bom" }
sdk-jvm-library = { id = "sdk.jvm.library" }
