org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Nexus 仍要求 MD5/SHA1。jcenter/bintray 已关停，这里没有 com.jfrog.bintray。
systemProp.org.gradle.internal.publish.checksums.insecure=true
systemProp.org.gradle.internal.http.socketTimeout=120000

# independent：每个 library 在自己的 build.gradle.kts 里写 version。
# unified：忽略模块 version，全部使用下面的 sdk.version，并配合 BOM。
sdk.versionMode=independent
sdk.version=0.1.0
sdk.group=io.fastdowload

# 共享 POM 元数据。账号、密码、GPG 私钥不要写进本文件。
POM_URL=https://github.com/ArturoYi/fast-prism
POM_SCM_URL=https://github.com/ArturoYi/fast-prism
POM_SCM_CONNECTION=scm:git:git://github.com/ArturoYi/fast-prism.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ArturoYi/fast-prism.git
POM_LICENCE_NAME=The Apache License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=ArturoYi
POM_DEVELOPER_NAME=ArturoYi
POM_DEVELOPER_URL=https://github.com/ArturoYi
POM_INCEPTION_YEAR=2026

# 可选：新注册的 Sonatype namespace 如果落在 s01，再打开下一行。
# sdk.sonatypeHost=S01

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
