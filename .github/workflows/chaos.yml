name: Chaos

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos:
    name: 杀进程恢复 20 次
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 混沌恢复
        run: ./gradlew :fast-dowload:engine:test --tests com.arturoyi.fastdowload.engine.ChaosResumeTest --stacktrace
